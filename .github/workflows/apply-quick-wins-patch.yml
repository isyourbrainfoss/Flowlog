name: Apply quick-wins patch

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply large-file quick-wins patches
        run: |
          set -euo pipefail
          shopt -s nullglob
          for p in .ci/qw-patches/*.patch; do
            echo "Applying $p"
            git apply --index "$p"
          done
          git config user.name "isyourbrainfoss"
          git config user.email "isyourbrainfoss@proton.me"
          git commit -m "feat(0.0.3): large-file quick wins (shell, sensors, sync sites, lock)"
          git push origin HEAD:main
      - name: Cleanup helpers
        run: |
          set -euo pipefail
          git rm -rf .ci/qw-patches .ci/rem.*.b64.txt .ci/remaining.patch \
            .ci/qw-*.b64.txt .ci/quick-wins-0.0.3*.patch \
            .github/workflows/apply-quick-wins-patch.yml || true
          git add -A
          if ! git diff --cached --quiet; then
            git commit -m "chore: remove quick-wins patch helpers"
            git push origin HEAD:main
          fi
