name: Cleanup quick-wins helpers

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Remove helper artifacts
        run: |
          set -euo pipefail
          git config user.name "isyourbrainfoss"
          git config user.email "isyourbrainfoss@proton.me"
          git rm -rf .ci/qw-patches .ci/rem.*.b64.txt .ci/remaining.patch \
            .ci/qw-*.b64.txt .ci/quick-wins-0.0.3*.patch || true
          # Do not delete workflow files here (needs workflows permission).
          if git diff --cached --quiet; then
            echo "Nothing to clean"
            exit 0
          fi
          git commit -m "chore: remove quick-wins patch helpers"
          git push origin HEAD:main
