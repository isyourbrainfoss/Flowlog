name: Cleanup quick-wins helpers

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Remove helper artifacts
        run: |
          set -euo pipefail
          shopt -s nullglob
          git config user.name "isyourbrainfoss"
          git config user.email "isyourbrainfoss@proton.me"
          paths=()
          if [ -d .ci/qw-patches ]; then paths+=(.ci/qw-patches); fi
          for f in .ci/rem.*.b64.txt .ci/remaining.patch .ci/qw-*.b64.txt .ci/quick-wins-0.0.3*.patch; do
            paths+=("$f")
          done
          if [ ${#paths[@]} -eq 0 ]; then
            echo "Nothing to remove"
            exit 0
          fi
          git rm -rf --ignore-unmatch "${paths[@]}"
          if git diff --cached --quiet; then
            echo "Nothing staged"
            exit 0
          fi
          git commit -m "chore: remove quick-wins patch helpers"
          git push origin HEAD:main
