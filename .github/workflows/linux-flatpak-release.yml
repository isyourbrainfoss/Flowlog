name: Linux Flatpak Release

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: flatpak-pages
  cancel-in-progress: true

jobs:
  build-x86_64:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            clang cmake ninja-build pkg-config libgtk-3-dev \
            libblkid-dev liblzma-dev libsecret-1-dev \
            flatpak flatpak-builder

      - name: Install GNOME SDK
        run: |
          flatpak remote-add --if-not-exists --user flathub https://flathub.org/repo/flathub.flatpakrepo
          flatpak install -y --user flathub org.gnome.Platform//50 org.gnome.Sdk//50

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Build Flatpak (x86_64)
        env:
          REPO_DIR: ${{ github.workspace }}/flatpak-pages-repo
        run: |
          mkdir -p "$REPO_DIR"
          ./flatpak/build-flatpak.sh x86_64

      - name: Upload x86_64 repo
        uses: actions/upload-artifact@v4
        with:
          name: flatpak-repo-x86_64
          path: flatpak-pages-repo

      - name: Upload x86_64 bundle
        uses: actions/upload-artifact@v4
        with:
          name: flatpak-bundle-x86_64
          path: flatpak/com.flowlog.flowlog-x86_64.flatpak

  build-aarch64:
    needs: build-x86_64
    runs-on: ubuntu-24.04-arm
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            clang cmake ninja-build pkg-config libgtk-3-dev \
            libblkid-dev liblzma-dev libsecret-1-dev \
            flatpak flatpak-builder

      - name: Install GNOME SDK
        run: |
          flatpak remote-add --if-not-exists --user flathub https://flathub.org/repo/flathub.flatpakrepo
          flatpak install -y --user flathub org.gnome.Platform//50 org.gnome.Sdk//50

      # flutter-action cannot install ARM64 SDKs (no prebuilt archive); clone instead.
      - name: Set up Flutter
        run: |
          FLUTTER_ROOT="${RUNNER_TOOL_CACHE}/flutter"
          git clone https://github.com/flutter/flutter.git -b stable --depth 1 "$FLUTTER_ROOT"
          echo "${FLUTTER_ROOT}/bin" >> "$GITHUB_PATH"
          export PATH="${FLUTTER_ROOT}/bin:$PATH"
          flutter config --no-analytics
          flutter precache --linux
          flutter --version

      - name: Download x86_64 repo
        uses: actions/download-artifact@v4
        with:
          name: flatpak-repo-x86_64
          path: flatpak-pages-repo

      - name: Build Flatpak (aarch64)
        env:
          REPO_DIR: ${{ github.workspace }}/flatpak-pages-repo
        run: ./flatpak/build-flatpak.sh aarch64

      - name: Upload combined repo
        uses: actions/upload-artifact@v4
        with:
          name: flatpak-repo
          path: flatpak-pages-repo

      - name: Upload aarch64 bundle
        uses: actions/upload-artifact@v4
        with:
          name: flatpak-bundle-aarch64
          path: flatpak/com.flowlog.flowlog-aarch64.flatpak

  publish:
    needs: build-aarch64
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download combined Flatpak repo
        uses: actions/download-artifact@v4
        with:
          name: flatpak-repo
          path: site

      - name: Add flatpakrepo file
        run: |
          cp flatpak/flowlog.flatpakrepo site/flowlog.flatpakrepo
          touch site/.nojekyll

      - name: Deploy Flatpak repo to gh-pages (merge with Android mirror)
        id: pages_deploy
        continue-on-error: true
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: site
          publish_branch: gh-pages
          keep_files: true
          enable_jekyll: false

      - name: Retry Flatpak gh-pages deploy
        if: steps.pages_deploy.outcome == 'failure'
        run: sleep 20

      - name: Deploy Flatpak repo to gh-pages (retry)
        if: steps.pages_deploy.outcome == 'failure'
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: site
          publish_branch: gh-pages
          keep_files: true
          enable_jekyll: false

      - name: Download Flatpak bundles
        uses: actions/download-artifact@v4
        with:
          pattern: flatpak-bundle-*
          path: bundles
          merge-multiple: true

      - name: Resolve Android release tag for this commit
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG=""
          for attempt in $(seq 1 36); do
            while read -r tag; do
              commit=$(gh api "repos/${{ github.repository }}/commits/${tag}" -q .sha 2>/dev/null || true)
              if [ "$commit" = "${{ github.sha }}" ]; then
                TAG="$tag"
                break 2
              fi
            done < <(gh release list --repo "${{ github.repository }}" --limit 40 --json tagName -q '.[].tagName')
            echo "Waiting for Android release for ${{ github.sha }} (attempt ${attempt}/36)…" >&2
            sleep 10
          done

          if [ -z "$TAG" ]; then
            echo "No release for ${{ github.sha }} after 6 minutes; skipping bundle upload" >&2
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "tag=$TAG" >> "$GITHUB_OUTPUT"
            echo "skip=false" >> "$GITHUB_OUTPUT"
            echo "Matched release tag: $TAG" >&2
          fi

      - name: Checksums for the bundles
        if: steps.release.outputs.skip != 'true'
        run: |
          cd bundles
          sha256sum com.flowlog.flowlog-x86_64.flatpak > com.flowlog.flowlog-x86_64.flatpak.sha256
          sha256sum com.flowlog.flowlog-aarch64.flatpak > com.flowlog.flowlog-aarch64.flatpak.sha256

      - name: Upload Flatpak bundles to release
        if: steps.release.outputs.skip != 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.release.outputs.tag }}
          append_body: true
          body: |
            **Linux Flatpak (signed shared repo):**
            ```bash
            flatpak remote-add --if-not-exists --user isyourbrainfoss \
              https://isyourbrainfoss.github.io/flatpak/isyourbrainfoss.flatpakrepo
            flatpak install --user isyourbrainfoss com.flowlog.flowlog
            ```
          files: |
            bundles/com.flowlog.flowlog-x86_64.flatpak
            bundles/com.flowlog.flowlog-aarch64.flatpak
            bundles/com.flowlog.flowlog-x86_64.flatpak.sha256
            bundles/com.flowlog.flowlog-aarch64.flatpak.sha256
          fail_on_unmatched_files: false

      - name: Notify isyourbrainfoss/flatpak
        # The shared, signed repo (https://isyourbrainfoss.github.io/flatpak/) imports and signs
        # the bundles. No signing key lives here. Skipped when the secret is not set.
        if: steps.release.outputs.skip != 'true'
        env:
          DISPATCH_TOKEN: ${{ secrets.FLATPAK_DISPATCH_TOKEN }}
          TAG: ${{ steps.release.outputs.tag }}
        run: |
          if [ -z "$DISPATCH_TOKEN" ]; then
            echo "::notice::FLATPAK_DISPATCH_TOKEN not set; the shared repo picks this up on its weekly or a manual run."
            exit 0
          fi
          GH_TOKEN="$DISPATCH_TOKEN" gh api repos/isyourbrainfoss/flatpak/dispatches \
            -f event_type=app-updated \
            -F 'client_payload[app]=com.flowlog.flowlog' \
            -F "client_payload[tag]=$TAG"
