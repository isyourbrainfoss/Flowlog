name: restore-test-file
on:
  workflow_dispatch:
jobs:
  restore:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Restore and fix save_shot_test.dart
        run: |
          set -euo pipefail
          git show 9658b6e231841e9ccb52aee6ef0e0106b46048c0:app/flowlog/test/save_shot_test.dart > app/flowlog/test/save_shot_test.dart
          sed -i "s/shot_discard_action/brew_complete_discard/g" app/flowlog/test/save_shot_test.dart
          grep -n brew_complete_discard app/flowlog/test/save_shot_test.dart
          if grep -q shot_discard_action app/flowlog/test/save_shot_test.dart; then
            echo "stale key still present" >&2
            exit 1
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/flowlog/test/save_shot_test.dart
          git commit -m "test: update discard snackbar key for brew-complete overlay"
          git push origin HEAD:main
